spring:
  application:
    name: framelab
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:framelab}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:framelab}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

framelab:
  security:
    jwt-secret: ${FRAMELAB_JWT_SECRET:framelab-dev-secret-change-me-32bytes}
    issuer: framelab-api
    audience: framelab-web
    access-token-ttl: ${FRAMELAB_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${FRAMELAB_REFRESH_TOKEN_TTL:7d}
    cookie-name: framelab_rt
    cookie-secure: ${FRAMELAB_COOKIE_SECURE:false}
    cors-allowed-origins: ${FRAMELAB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    login-max-failures: 5
    login-window: 15m
  storage:
    root: ${FRAMELAB_STORAGE_ROOT:./storage}
    max-file-size-bytes: 10485760
    max-request-file-size-bytes: 11534336
    max-pixels: 40000000
    max-dimension: 8192
    max-normalized-dimension: 4096

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.framelab: INFO
